# Once a day, pin to the newest stable openai/codex rust-vX.Y.Z release.
# If the pin moves and patches/ still apply, commit and tag vX.Y.Z.
# release.yml, dispatched on that tag, builds and publishes it;
# owngoal-packages picks it up at 04:00 UTC.

name: Follow upstream

on:
  schedule:
    # Daily 00:00 UTC, ahead of owngoal-packages' 04:00 UTC fetch.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: follow-upstream
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Follow openai/codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/follow-upstream.sh
          read -r new_version new_ref new_tag <<<"$(./scripts/follow-upstream.sh --print)"
          current_ref="$(make --no-print-directory print-upstream)"
          current_version="$(make --no-print-directory print-version)"
          current_upstream_version="${current_version%%-*}"
          echo "current $current_version @ $current_ref"
          echo "latest  $new_version ($new_tag) @ $new_ref"
          if python3 - "$new_version" "$current_upstream_version" <<'PY'
          import sys
          candidate = tuple(map(int, sys.argv[1].split(".")))
          current = tuple(map(int, sys.argv[2].split(".")))
          raise SystemExit(candidate > current)
          PY
          then
            echo "no newer stable version than $current_upstream_version"
            echo "changed=false" >>"$GITHUB_ENV"
            exit 0
          fi
          if git rev-parse "refs/tags/v${new_version}" >/dev/null 2>&1; then
            echo "tag v${new_version} already exists; not retagging"
            echo "changed=false" >>"$GITHUB_ENV"
            exit 0
          fi
          ./scripts/follow-upstream.sh
          {
            echo "changed=true"
            echo "new_version=${new_version}"
            echo "new_ref=${new_ref}"
          } >>"$GITHUB_ENV"

      - name: Commit pin and tag
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "bot"
          git config user.email "bot@owngoal.dev"
          git add configuration/upstream.env configuration/version.txt
          git commit -m "Bump upstream to rust-v${new_version}

          openai/codex ${new_ref}
          "
          git tag "v${new_version}"
          git push origin HEAD:main
          git push origin "v${new_version}"

      # A tag pushed with the workflow's own token never fires a push-triggered
      # workflow; workflow_dispatch is the documented exception, so start
      # Release explicitly on the tag.
      - name: Build and publish the tag
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${new_version}"
